name: test-matrix

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: skills/agents-discipline

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # 15, not 10: `npm test` now also runs the cmdrun unit suite (py-suite-runner.mjs), whose
    # burst/wait rows cost real seconds and spawn far slower on the Windows cells.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [16, 20, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      # setup-python pins ONE major.minor (3.12, the one the port was verified under locally) on all
      # three OSes, so a Windows red cannot be major.minor drift; the patch level is the highest 3.12.x
      # the runner can supply and may differ per OS (pin an exact patch from the setup-python
      # versions-manifest if a red ever looks patch-specific). Placed before `npm test`, it governs
      # the interpreter py-suite-runner.mjs resolves via PYTHON below, and the `python3` test:diff /
      # test:slow resolve on Linux/macOS. A deliberate determinism gain, not a side effect to undo.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run zero-dependency test suite
        env:
          # PYTHON names the interpreter for the Python suites inside `npm test`
          # (py-suite-runner.mjs): `python` on Windows, `python3` elsewhere -- pinned
          # by the setup-python step above rather than left to the runner image's
          # preinstalled aliases (the same convention the test:port step below uses).
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: npm test

      # EVERY tests/*-diff.sh suite is the PORT'S PRIMARY FIDELITY INSTRUMENT -- each runs the
      # .mjs oracle and the .py port on the same input and compares exit code, stdout and
      # stderr. Until 2026-09-07 not one of them was wired to CI or to `npm test`, so every
      # "identical" claim in the port rested on someone remembering to type them by hand.
      # Stated as the GLOB, never as a count: this said "the twelve" while fourteen existed,
      # because `test:diff` globs and no prose number can track that. The set is whatever
      # tests/*-diff.sh matches at run time -- to audit it, list the glob, do not trust a comment.
      # NOT a matrix-wide step: they are bash, and SEVERAL of them probe DIRECTORY PERMISSION
      # BITS (chmod 300), which has no Windows meaning. Windows keeps node-suite coverage only --
      # deliberate, not accidental. Reasoning and the darwin row-count baseline: TRDD-REJRD8V5.
      #
      # THE CONSEQUENCE, stated because the chmod reason above does not imply it: `npm test`
      # leaves AD_RUNTIME unset and therefore runs the ORACLE only, so it contributes NOTHING to
      # port coverage on any OS. The port's Windows coverage comes from the test:port step below,
      # which runs the four AD_RUNTIME-aware node suites against the port on every cell; only the
      # bash DIFFERENTIAL suites stay non-Windows.
      #
      # Making them Windows-tolerant would NOT make it safe to drop this `if:` -- npm's
      # script-shell defaults to cmd there, where this POSIX loop is not valid syntax (RECALLED,
      # not measured here, and a repo .npmrc could change it -- so lean on the chmod reason).
      - name: Run node-vs-python differential suites
        if: runner.os != 'Windows'
        run: npm run test:diff

      # test:port runs the four AD_RUNTIME-aware .mjs suites against the Python PORT (AD_RUNTIME=python)
      # -- the coverage the oracle-only `npm test` never gave them -- on EVERY matrix cell, Windows
      # included. Windows is the port's first non-POSIX verification: the port was verified locally
      # on macOS; 3a58d15 wired the ubuntu/macos cells; Windows had nothing. So read a red on a
      # windows-latest cell as a port finding FIRST (path separators, cmd quoting, CRLF, the
      # os.rename-on-existing-target divergence the card names) -- the config causes that could have
      # reddened it for a non-port reason are handled here, not papered over: the interpreter is
      # `python` on Windows and `python3` elsewhere (PYTHON below; every suite honors it -- the two
      # that hardcoded `python3` were fixed in the commit that wired Windows, ebd37cb), and
      # setup-python above pins one known version on all three OSes. "Could", not "would": no Windows
      # cell has run the port yet, so whether a bare `python3` resolves there is unmeasured -- `npm
      # test`'s own python-lib-checks.py step invokes `python3` on the same runner, so if a Windows
      # red looks interpreter-specific, compare the two steps before blaming the port. The script
      # GUARDS its env: run without AD_RUNTIME=python and it refuses loudly rather than silently
      # testing the oracle and reporting green.
      - name: Run the AD_RUNTIME-aware suites against the Python port
        env:
          AD_RUNTIME: python
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: npm run test:port

      # test:slow is one deterministic ~35s node-vs-python gate-timeout check (item 14's
      # check-timeout-slow.sh) -- pinned to a single cell; node-version spread buys it nothing.
      - name: Run the slow gate-timeout check (node vs python)
        if: runner.os == 'Linux' && matrix.node == 20
        run: npm run test:slow

  # cmdrun's own unit suite (py-suite-runner.mjs) as a SEPARATE JOB, not a step. The step
  # version of this idea (a01dd71, mid-job and then moved LAST) does not actually decouple:
  # a failing step aborts the remaining steps of ITS JOB, so with ledger-tests red on Windows
  # (CI run 36189285473, 20 rows deliberately ungated -- they mix fixture assumptions and
  # possible real win32 checker defects, reports/no-bash/20260925_2300+0200-windows-ci-proof-run1.md)
  # the job died in `npm test` and the cmdrun step never ran at all -- measured on run
  # 36193594157 (SHA a01dd71), whose Windows cells show zero py-suite-runner output. A job
  # with NO `needs:` runs unconditionally: this is the only shape in which the cmdrun Windows
  # verdict is truly independent of every other suite's color. Chosen over reordering
  # py-suite-runner before ledger-tests in the `test` script (masks ledger-tests behind a
  # cmdrun red in the same chain) and over a LAST-position step (aborted with the job -- the
  # measured failure). Idempotence scope: verified twice-run-clean on macOS only; the
  # Windows-specific rows have never executed anywhere, so their idempotence is what this
  # job's first Windows run measures. The required-checks ruleset
  # (baseline-pr-and-checks) ENUMERATES its contexts ("Test", the libuv job name, ...), so
  # this job's checks are informational until someone adds them -- a cmdrun-proof red
  # cannot block a merge by policy. ASYMMETRY, deliberate: windows-node-22-14 (libuv
  # variant) carries no separate cmdrun coverage -- its cmdrun verdict rides the in-chain
  # position only, because libuv variance is what that job isolates.
  cmdrun-proof:
    name: cmdrun unit suite / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The suite's slowest rows (burst/wait) drive the same headroom the `npm test` job's
    # 10->15 bump was justified by (see that job's timeout comment).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          # One cell of the `test` matrix runs node 20.x as `matrix.node: 20` -- also a
          # floating major, so this job intentionally matches THAT cell's drift envelope
          # rather than pinning a patch the matrix itself does not pin. The node spread
          # rides in the `test` job; this job's purpose is the OS spread.
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run the cmdrun unit suite
        working-directory: skills/agents-discipline
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: node tests/py-suite-runner.mjs

  windows-node-22-14:
    name: windows-latest / node 22.14.0 (libuv 1.49.2)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up affected Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.14.0
      # Pin the same 3.12 as the matrix job: py-suite-runner.mjs needs `python` (this job has
      # no matrix env block), and an unpinned runner-image python could drift under the proof.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify affected runtime and run zero-dependency test suite
        shell: pwsh
        env:
          # windows-latest: only `python` resolves (see the PYTHON comment on the matrix job).
          PYTHON: python
        run: |
          if ((node -p "process.version") -ne "v22.14.0") { throw "wrong Node version" }
          if ((node -p "process.versions.uv") -ne "1.49.2") { throw "wrong libuv version" }
          npm test
