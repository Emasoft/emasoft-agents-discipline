name: test-matrix

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: skills/agents-discipline

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [16, 20, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Run zero-dependency test suite
        run: npm test

      # The twelve *-diff.sh suites are the PORT'S PRIMARY FIDELITY INSTRUMENT -- each runs the
      # .mjs oracle and the .py port on the same input and compares exit code, stdout and
      # stderr. Until 2026-09-07 not one of them was wired to CI or to `npm test`, so every
      # "identical" claim in the port rested on someone remembering to type them by hand.
      # NOT folded into `npm test`: they are bash, and several probe DIRECTORY PERMISSION BITS
      # (chmod 300), which has no Windows meaning -- hence the guard rather than a matrix-wide
      # step. Coverage on windows-latest is therefore the node suites only, and that gap is
      # deliberate and recorded, not accidental.
      - name: Run node-vs-python differential suites
        if: runner.os != 'Windows'
        run: npm run test:diff

  windows-node-22-14:
    name: windows-latest / node 22.14.0 (libuv 1.49.2)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up affected Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.14.0
      - name: Verify affected runtime and run zero-dependency test suite
        shell: pwsh
        run: |
          if ((node -p "process.version") -ne "v22.14.0") { throw "wrong Node version" }
          if ((node -p "process.versions.uv") -ne "1.49.2") { throw "wrong libuv version" }
          npm test
